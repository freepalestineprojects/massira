<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>تسجيل الدخول — لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --black: #08090a; --deep: #0e1117; --surface: #141820; --card: #181e28;
    --border: #252d3d; --border-soft: #1e2535;
    --gold: #c9a84c; --gold-light: #e8c97a; --gold-dim: #7a6230; --gold-glow: rgba(201,168,76,.15);
    --white: #edeae2; --muted: #7a8799; --faint: #3a4555;
    --c-cancelled: #e05c5c;
    --radius: 12px; --radius-sm: 8px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--black); color: var(--white); font-family: 'Outfit', sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 1.5rem;
    background-image: radial-gradient(ellipse 70% 60% at 50% 0%, #171b12 0%, transparent 60%), var(--black);
  }
  .login-box {
    width: 100%; max-width: 380px;
    background: var(--deep);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2rem 1.8rem;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
  }
  .login-logo {
    font-family: 'Amiri', serif; font-size: 1.4rem; color: var(--gold-light);
    text-align: center; margin-bottom: .3rem;
  }
  .login-sub {
    text-align: center; font-size: .72rem; letter-spacing: .2em; text-transform: uppercase;
    color: var(--gold-dim); margin-bottom: 2rem;
  }
  .form-group { margin-bottom: 1.1rem; }
  .form-group label {
    display: block; font-size: .68rem; letter-spacing: .1em; color: var(--faint); margin-bottom: .4rem;
  }
  .form-group input {
    width: 100%; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: .75rem .9rem; color: var(--white);
    font-family: 'Outfit', sans-serif; font-size: .9rem; outline: none; transition: border-color .2s;
  }
  .form-group input:focus { border-color: var(--gold-dim); }
  .form-group input.invalid { border-color: var(--c-cancelled); }
  .error-banner {
    display: none; background: rgba(224,92,92,.1); border: 1px solid rgba(224,92,92,.35);
    color: #ff9b9b; font-size: .8rem; padding: .7rem .9rem; border-radius: var(--radius-sm);
    margin-bottom: 1.1rem; line-height: 1.5;
  }
  .error-banner.show { display: block; }
  .btn-login {
    width: 100%; padding: .8rem; border-radius: var(--radius-sm);
    background: var(--gold-glow); border: 1px solid var(--gold-dim); color: var(--gold-light);
    font-family: 'Outfit', sans-serif; font-size: .88rem; letter-spacing: .05em; font-weight: 500;
    cursor: pointer; transition: all .15s; margin-top: .4rem;
  }
  .btn-login:hover:not(:disabled) { background: var(--gold-dim); color: var(--black); }
  .btn-login:disabled { opacity: .55; cursor: not-allowed; }
  .back-link {
    display: block; text-align: center; margin-top: 1.4rem; font-size: .78rem;
    color: var(--muted); text-decoration: none;
  }
  .back-link:hover { color: var(--gold); }
</style>
</head>
<body>
  <div class="login-box">
    <div class="login-logo">نصرة الحق | مسيرة</div>
    <div class="login-sub">لوحة تحكم المشرفين</div>

    <div class="error-banner" id="errorBanner"></div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="username">اسم المستخدم</label>
        <input type="text" id="username" autocomplete="username" required />
      </div>
      <div class="form-group">
        <label for="password">كلمة المرور</label>
        <input type="password" id="password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn-login" id="loginBtn">تسجيل الدخول</button>
    </form>

    <a href="index.html" class="back-link">← العودة إلى الموقع</a>
  </div>

<script>
const API_BASE = "https://massira.up.railway.app";
const LOGIN_ENDPOINT = `${API_BASE}/v1/api/auth/login`;

const form = document.getElementById('loginForm');
const usernameInput = document.getElementById('username');
const passwordInput = document.getElementById('password');
const errorBanner = document.getElementById('errorBanner');
const loginBtn = document.getElementById('loginBtn');

if (localStorage.getItem('admin_token')) {
  window.location.href = 'index.html';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBanner.classList.remove('show');
  usernameInput.classList.remove('invalid');
  passwordInput.classList.remove('invalid');

  const username = usernameInput.value.trim();
  const password = passwordInput.value;

  if (username.length < 4) {
    usernameInput.classList.add('invalid');
    errorBanner.textContent = 'اسم المستخدم يجب أن يكون 4 أحرف على الأقل.';
    errorBanner.classList.add('show');
    return;
  }
  if (password.length < 8) {
    passwordInput.classList.add('invalid');
    errorBanner.textContent = 'كلمة المرور يجب أن تكون 8 أحرف على الأقل.';
    errorBanner.classList.add('show');
    return;
  }

  loginBtn.disabled = true;
  loginBtn.textContent = 'جارٍ التحقق…';

  try {
    const res = await fetch(LOGIN_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });

    if (res.status === 200) {
      const data = await res.json();
      localStorage.setItem('admin_token', data.access_token);
      window.location.href = 'index.html';
      return;
    }

    if (res.status === 404) {
      errorBanner.textContent = 'اسم المستخدم أو كلمة المرور غير صحيحة.';
    } else if (res.status === 422) {
      errorBanner.textContent = 'تحقق من صحة البيانات المدخلة.';
    } else {
      errorBanner.textContent = 'حدث خطأ غير متوقع. حاول مرة أخرى.';
    }
    errorBanner.classList.add('show');
  } catch (err) {
    console.error(err);
    errorBanner.textContent = 'تعذّر الاتصال بالخادم. تحقق من اتصالك بالإنترنت.';
    errorBanner.classList.add('show');
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = 'تسجيل الدخول';
  }
});
</script>
</body>
</html>
